<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1b18;--mut:#6f6a62;--line:#e4e1da;--fit:#1f7a4d;--fitbg:#e3f3ea;
--unc:#8a5a00;--uncbg:#fbf0d9;--no:#b3261e;--nobg:#fbe4e2;--acc:#2f5bd3;--accbg:#e6ecfb;--hl:#fff1a8;--shadow:0 6px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161513;--card:#22201d;--fg:#f1eee8;--mut:#a39d93;
--line:#3a3631;--fit:#6fd3a0;--fitbg:#163527;--unc:#f0c46a;--uncbg:#3a2e14;--no:#ff8a80;--nobg:#3d1a17;--acc:#8fb0ff;--accbg:#1d2740;--hl:#4a4012;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:19px;margin:0 0 4px}.mut{color:var(--mut)}.sm{font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin:12px 0}
button{font:inherit;font-weight:600;border-radius:9px;border:1px solid var(--line);padding:8px 12px;cursor:pointer;background:var(--card);color:var(--fg)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.link{border:0;background:none;color:var(--acc);padding:0;font-weight:500}
input[type=text]{font:inherit;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 12px;font-weight:500}.seg button.on{background:var(--acc);color:#fff}
.seg.big button{padding:9px 18px;font-weight:600}
.msg{margin-top:10px;padding:9px 11px;border-radius:9px;background:var(--uncbg);font-size:14px}.msg.ok{background:var(--fitbg)}
.msg button{padding:4px 10px;margin:4px 6px 0 0;font-size:13px}
.rule{display:inline-flex;align-items:center;gap:6px;background:var(--accbg);border-radius:99px;padding:3px 4px 3px 10px;margin:8px 6px 0 0;font-size:13px}
.rule button{border:0;background:none;padding:0 6px;font-size:15px;color:var(--mut)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.c-keep{background:var(--fitbg);color:var(--fit)}.c-exclude{background:var(--nobg);color:var(--no)}.c-review{background:var(--uncbg);color:var(--unc)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}.item.chg{background:var(--hl)}
.co-head{cursor:pointer}.co-name{font-weight:650}.caret{display:inline-block;width:14px;color:var(--mut)}
.person{padding-left:38px;background:color-mix(in srgb,var(--bg) 45%,var(--card))}.person.chg{background:var(--hl)}
.pname{font-weight:600}.pname a{color:inherit}.meta{font-size:13px;color:var(--mut)}.why{font-size:13px;color:var(--unc);margin-top:2px}
.tog{display:flex;gap:6px;align-items:center}
.tog button{padding:6px 12px;font-size:14px}.tog button.on.k{background:var(--fit);border-color:var(--fit);color:#fff}
.tog button.on.x{background:var(--no);border-color:var(--no);color:#fff}
.state{font-size:12px;color:var(--mut);text-align:right;margin-top:3px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.foot .in{max-width:980px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.foot b{font-size:17px}.legend{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--hl);border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
textarea{width:100%;font:13px ui-monospace,Menlo,monospace;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-height:64px;margin-top:8px}
@media (max-width:640px){.item{grid-template-columns:1fr}.state{text-align:left}.person{padding-left:22px}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const CARDS = __CARDS__;
const GEO = __GEO__;
const KEY = "ls-review3-__REVIEW_ID__";
let state = {view: "company", d: {}, rules: [], open: {}, finished: false};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.d) state = Object.assign(state, s); } catch (e) {}
CARDS.forEach(c => { if (c.decision && !state.d[c.n]) state.d[c.n] = c.decision; });
let ui = {mode: "exclude", msg: "", msgOk: false, q: "", filter: "all"};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const app = document.getElementById("app");
const SCOPE = {c: "company HQ", p: "contact", b: "company and contact"};

// ---- companies ---------------------------------------------------------------
const COMPANIES = [];
(() => { const by = {};
  CARDS.forEach(c => { const k = (c.company || "(no company)").trim().toLowerCase();
    if (!by[k]) { by[k] = {key: k, name: c.company || "(no company)", people: []}; COMPANIES.push(by[k]); }
    by[k].people.push(c); });
  COMPANIES.forEach(co => { const cnt = {};
    co.people.forEach(c => { if (c.company_country) cnt[c.company_country] = (cnt[c.company_country] || 0) + 1; });
    co.country = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || ""; });
  COMPANIES.forEach(co => { if (co.people.some(c => c.recommendation !== "keep") && state.open[co.key] === undefined) state.open[co.key] = true; });
})();

// ---- countries ------------------------------------------------------------
const DATA_COUNTRIES = {};
CARDS.forEach(c => [c.company_country, c.contact_country].forEach(x => { if (x) DATA_COUNTRIES[x] = 1; }));
const KNOWN = [...new Set([...Object.values(GEO.aliases), ...Object.keys(DATA_COUNTRIES)])].sort();
function lev(a, b) { const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n]; }
// -> {country} when sure, {ask:[...], note} when not, {none:true} when nothing fits
function resolveCountry(text) {
  const t = text.trim().toLowerCase().replace(/\s+/g, " ");
  if (!t) return null;
  if (GEO.ambiguous[t]) return {ask: GEO.ambiguous[t].map(o => o.replace(/^United States.*/, "United States").replace(/ \(.*$/, "")),
    labels: GEO.ambiguous[t], note: `“${esc(text)}” could mean more than one place. Which one?`};
  for (const v of [t, t.replace(/\./g, "")]) {
    if (GEO.aliases[v]) return {country: GEO.aliases[v]};
    const k = KNOWN.find(x => x.toLowerCase() === v); if (k) return {country: k};
  }
  if (GEO.states.includes(t)) return {ask: ["United States"], note: `${esc(text)} is a US state. Rules work by country. Did you mean the United States?`};
  if (GEO.provinces.includes(t)) return {ask: ["Canada"], note: `${esc(text)} is a Canadian province. Rules work by country. Did you mean Canada?`};
  const cands = KNOWN.map(k => { const l = k.toLowerCase();
      return {k, s: l.startsWith(t) ? 0 : Math.min(lev(t, l), ...Object.entries(GEO.aliases).filter(([a, c]) => c === k).map(([a]) => lev(t, a)))}; })
    .filter(x => x.s <= Math.max(2, Math.floor(t.length / 4))).sort((a, b) => a.s - b.s || a.k.localeCompare(b.k)).slice(0, 4);
  if (cands.length) return {ask: cands.map(x => x.k), note: `Not sure which country “${esc(text)}” is. Did you mean:`};
  return {none: true};
}


// ---- decisions -----------------------------------------------------------------
function ruleFor(c) {
  const cc = {c: c.company_country, p: c.contact_country};
  for (const r of state.rules) if (r.mode === "exclude")
    for (const s of ["c", "p"]) if ((r.scope === s || r.scope === "b") && cc[s] === r.country) return `country rule: exclude ${r.country} (${SCOPE[s]})`;
  for (const s of ["c", "p"]) {
    const inc = state.rules.filter(r => r.mode === "include" && (r.scope === s || r.scope === "b")).map(r => r.country);
    if (inc.length && cc[s] && !inc.includes(cc[s])) return `country rule: ${SCOPE[s]} not in ${inc.join(", ")}`;
  }
  return "";
}
// final answer for a contact: yours > country rule > Claude's suggestion (blank = still open)
function final(c) {
  if (state.d[c.n]) return {d: state.d[c.n], why: "your choice"};
  const r = ruleFor(c); if (r) return {d: "exclude", why: r};
  if (c.recommendation === "keep" || c.recommendation === "exclude") return {d: c.recommendation, why: "Claude's suggestion"};
  return {d: "", why: "needs your answer"};
}
const changed = c => { const f = final(c); return f.d && f.d !== c.recommendation && c.recommendation !== "review" || f.why.startsWith("country rule"); };
const whyFlag = c => c.recommendation === "keep" ? "" : c.verdicts.filter(v => v.fit !== "fit").map(v => `${v.label}: ${v.reason}`).join(" · ");
const matches = c => {
  const q = ui.q.trim().toLowerCase(), f = final(c);
  if (q && ![c.name, c.title, c.company, c.contact_country, c.company_country].join(" ").toLowerCase().includes(q)) return false;
  return ui.filter === "all" || (ui.filter === "open" && !f.d) || (ui.filter === "flag" && c.recommendation !== "keep")
    || (ui.filter === "chg" && changed(c)) || (ui.filter === "exc" && f.d === "exclude");
};

// ---- page -----------------------------------------------------------------------
function personRow(c, indent) {
  const f = final(c), w = whyFlag(c);
  const name = c.linkedin ? `<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name);
  return `<div class="item ${indent ? "person" : ""} ${changed(c) ? "chg" : ""}"><div>
    <div class="pname">${name}</div>
    <div class="meta">${esc(c.title) || "no title"}${indent ? "" : ` · <b>${esc(c.company)}</b>`} · contact in ${esc(c.contact_country) || "unknown"}${indent ? "" : ` · company HQ ${esc(c.company_country) || "unknown"}`}</div>
    ${w ? `<div class="why">Claude flagged: ${esc(w)}</div>` : ""}</div>
    <div><div class="tog"><button class="x ${f.d === "exclude" ? "on" : ""}" data-n="${c.n}" data-v="exclude">✗ Exclude</button><button class="k ${f.d === "keep" ? "on" : ""}" data-n="${c.n}" data-v="keep">✓ Keep</button></div>
    <div class="state">${esc(f.why)}</div></div></div>`;
}
function companyBlock(co) {
  const ppl = co.people.filter(matches);
  if (!ppl.length) return "";
  const fs = co.people.map(final), k = fs.filter(f => f.d === "keep").length, x = fs.filter(f => f.d === "exclude").length, o = fs.length - k - x;
  const open = !!state.open[co.key];
  const summary = [k && `${k} kept`, x && `${x} excluded`, o && `<span style="color:var(--unc)">${o} need${o > 1 ? "" : "s"} your answer</span>`].filter(Boolean).join(" · ");
  return `<div class="item co-head ${co.people.some(changed) && !open ? "chg" : ""}" data-co="${esc(co.key)}"><div>
    <span class="caret">${open ? "▾" : "▸"}</span><span class="co-name">${esc(co.name)}</span>
    <span class="meta"> · HQ ${esc(co.country) || "unknown"} · ${co.people.length} contact${co.people.length > 1 ? "s" : ""} · ${summary}</span></div>
    <div class="tog"><button class="x ${x === fs.length ? "on" : ""}" data-all="${esc(co.key)}" data-v="exclude">✗ Exclude all</button><button class="k ${k === fs.length ? "on" : ""}" data-all="${esc(co.key)}" data-v="keep">✓ Keep all</button></div></div>` +
    (open ? ppl.map(c => personRow(c, true)).join("") : "");
}
function render() {
  const view = state.view, fs = CARDS.map(final);
  const K = fs.filter(f => f.d === "keep").length, X = fs.filter(f => f.d === "exclude").length, O = fs.length - K - X;
  const nChg = CARDS.filter(changed).length;
  const scope = view === "company" ? "c" : "p";
  const counts = {}; CARDS.forEach(c => { const v = (view === "company" ? c.company_country : c.contact_country) || "unknown"; counts[v] = (counts[v] || 0) + 1; });
  const body = view === "company" ? COMPANIES.map(companyBlock).join("") : CARDS.filter(matches).map(c => personRow(c, false)).join("");
  const F = [["all", "Everyone"], ["flag", "Flagged by Claude"], ["open", `Need your answer (${O})`], ["chg", `Changed (${nChg})`], ["exc", "Excluded"]];
  const sy = window.scrollY, focus = document.activeElement && document.activeElement.id;
  app.innerHTML = `<h1>__TITLE__</h1>
  <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="mut" style="flex:1 1 400px">${CARDS.length} contacts at ${COMPANIES.length} companies. Claude's suggestion is filled in; change anything you disagree with. Rows highlighted in yellow differ from Claude's suggestion.</div>
    <button class="p fin">Finish review — get the code</button></div>
  ${state.finished ? finishBox(O) : ""}
  <div class="box"><div class="row" style="justify-content:space-between">
    <span class="seg big" id="view"><button data-v="company" class="${view === "company" ? "on" : ""}">Companies</button><button data-v="contact" class="${view === "contact" ? "on" : ""}">Contacts</button></span>
    <span class="sm mut">${view === "company" ? "Showing companies (click one to see its contacts). Country rules apply to the company HQ." : "Showing every contact. Country rules apply to where the contact is."}</span></div>
    <div class="row" style="margin-top:12px"><input type="text" id="cty" list="ctylist" placeholder="Country, e.g. united states" autocomplete="off" style="flex:1 1 200px">
    <datalist id="ctylist">${KNOWN.map(k => `<option value="${esc(k)}">`).join("")}</datalist>
    <span class="seg" id="gm"><button data-v="include" class="${ui.mode === "include" ? "on" : ""}">Include only</button><button data-v="exclude" class="${ui.mode === "exclude" ? "on" : ""}">Exclude</button></span>
    <button class="p" id="gadd">Add rule</button></div>
    ${ui.msg ? `<div class="msg ${ui.msgOk ? "ok" : ""}">${ui.msg}</div>` : ""}
    <div>${state.rules.map((r, i) => `<span class="rule">${r.mode === "include" ? "Include only" : "Exclude"} <b>${esc(r.country)}</b> · ${SCOPE[r.scope]} · ${CARDS.filter(c => ruleOnly(r, c)).length} excluded<button data-del="${i}" title="Remove">×</button></span>`).join("")}</div>
    <div class="sm mut" style="margin-top:8px">${view === "company" ? "Company HQ" : "Contact"} countries: ${Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k)} ${v}`).join(" · ")}</div></div>
  <div class="row" style="margin:6px 0 10px"><input type="text" id="q" placeholder="Search name, title, company, country" value="${esc(ui.q)}" autocomplete="off" style="flex:1 1 220px">
    <span class="seg" id="flt">${F.map(([k, l]) => `<button data-v="${k}" class="${ui.filter === k ? "on" : ""}">${l}</button>`).join("")}</span>
    ${view === "company" ? `<button class="link" id="exp">Expand all</button><button class="link" id="col">Collapse all</button>` : ""}</div>
  <div class="list">${body || '<div class="item mut">Nothing matches.</div>'}</div>
  ${state.finished ? finishBox(O) : ""}
  <div class="foot"><div class="in"><span><b>${K}</b> keep</span><span><b>${X}</b> exclude</span><span style="${O ? "color:var(--unc)" : ""}"><b>${O}</b> need your answer</span>
    <span class="sm mut"><span class="legend"></span>${nChg} changed from Claude's suggestion</span><span style="flex:1"></span>
    <button class="p fin">Finish review — get the code</button></div></div>`;
  wire();
  window.scrollTo(0, sy);
  if (focus && document.getElementById(focus) && ["q", "cty"].includes(focus)) { const el = document.getElementById(focus); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function ruleOnly(r, c) { const keep = state.rules; state.rules = [r]; const hit = ruleFor(c); state.rules = keep; return hit; }
function codeNow() {
  const X = [], K = [];
  CARDS.forEach(c => { const d = final(c).d; if (d) (d === "exclude" ? X : K).push(c.n); });
  const ranges = a => { const out = []; for (let i = 0; i < a.length; i++) { let j = i;
      while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}-${a[j]}` : `${a[i]}`); i = j; } return out.join(","); };
  const R = state.rules.map(r => `${r.mode === "include" ? "+" : "-"}${r.scope}:${r.country}`).join("|");
  return `LS1;${CARDS.length};X:${ranges(X)};K:${ranges(K)}` + (R ? `;R:${R}` : "");
}
function finishBox(O) {
  if (O) return `<div class="box finbox"><b>${O} contact${O > 1 ? "s" : ""} still need${O > 1 ? "" : "s"} your answer.</b> Use the filter “Need your answer” to see them. Answer them, then press Finish again.</div>`;
  return `<div class="box finbox"><b>Done.</b> Check the yellow rows in the list (filter “Changed”), then copy this code and paste it into the chat. Claude shows the changes once more and saves them after your OK.
    <textarea class="code" readonly>${esc(codeNow())}</textarea><div class="row" style="margin-top:8px"><button class="p copy">Copy code</button></div></div>`;
}
function wire() {
  const $ = id => document.getElementById(id), all = sel => document.querySelectorAll(sel);
  all("#view button").forEach(b => b.onclick = () => { state.view = b.dataset.v; ui.msg = ""; save(); render(); });
  all("#gm button").forEach(b => b.onclick = () => { ui.mode = b.dataset.v; render(); });
  const reveal = () => { if (ui.q || ui.filter !== "all") COMPANIES.forEach(co => { if (co.people.some(matches)) state.open[co.key] = true; }); };
  all("#flt button").forEach(b => b.onclick = () => { ui.filter = b.dataset.v; reveal(); render(); });
  $("q").oninput = e => { ui.q = e.target.value; reveal(); render(); };
  $("gadd").onclick = () => tryAdd($("cty").value);
  $("cty").onkeydown = e => { if (e.key === "Enter") tryAdd(e.target.value); };
  all("[data-del]").forEach(b => b.onclick = () => { state.rules.splice(+b.dataset.del, 1); ui.msg = ""; save(); render(); });
  all("[data-pick]").forEach(b => b.onclick = () => addRule(b.dataset.pick, b.dataset.pick, false));
  all("[data-force]").forEach(b => b.onclick = () => addRule(b.dataset.force, b.dataset.force, true));
  all("[data-co]").forEach(el => el.onclick = e => { if (e.target.closest("button")) return; state.open[el.dataset.co] = !state.open[el.dataset.co]; save(); render(); });
  all("[data-all]").forEach(b => b.onclick = () => { COMPANIES.find(x => x.key === b.dataset.all).people.forEach(c => state.d[c.n] = b.dataset.v); save(); render(); });
  all("[data-n]").forEach(b => b.onclick = () => { state.d[b.dataset.n] = b.dataset.v; save(); render(); });
  all(".fin").forEach(b => b.onclick = () => { state.finished = true; save(); render();
    const boxes = document.querySelectorAll(".finbox"), box = b.closest(".foot") ? boxes[boxes.length - 1] : boxes[0];
    box.scrollIntoView({behavior: "smooth", block: "center"}); });
  all(".copy").forEach(cp => cp.onclick = async () => {
    const ta = cp.closest(".finbox").querySelector(".code");
    try { await navigator.clipboard.writeText(codeNow()); cp.textContent = "Copied ✓"; }
    catch (e) { ta.focus(); ta.select(); cp.textContent = "Selected — press Ctrl/Cmd+C"; } });
  const ex = $("exp"), co = $("col");
  if (ex) ex.onclick = () => { COMPANIES.forEach(x => state.open[x.key] = true); save(); render(); };
  if (co) co.onclick = () => { COMPANIES.forEach(x => state.open[x.key] = false); save(); render(); };
}
function tryAdd(text) {
  const r = resolveCountry(text); if (!r) return;
  ui.msgOk = false;
  if (r.none) { ui.msg = `“${esc(text)}” doesn't match any country I know. Check the spelling, or ask Claude in the chat.`; return render(); }
  if (r.ask) { ui.msg = `${r.note}<br>${r.ask.map((k, i) => `<button data-pick="${esc(k)}">${esc(r.labels ? r.labels[i] : k)}</button>`).join("")}`; return render(); }
  addRule(r.country, text, false);
}
function addRule(country, typed, confirmed) {
  const scope = state.view === "company" ? "c" : "p", rule = {mode: ui.mode, scope, country};
  if (state.rules.some(r => r.mode === rule.mode && r.scope === scope && r.country === country)) { ui.msg = "That rule is already there."; ui.msgOk = false; return render(); }
  const present = CARDS.filter(c => (scope === "c" ? c.company_country : c.contact_country) === country).length;
  const note = typed.trim().toLowerCase() !== country.toLowerCase() ? `Matched “${esc(typed)}” to <b>${esc(country)}</b>. ` : "";
  if (!present && rule.mode === "include" && !confirmed) {
    ui.msg = `${note}No ${SCOPE[scope]} on this list is in ${esc(country)}, so “include only” would exclude everyone with a known country. Add it anyway?<br><button data-force="${esc(country)}">Yes, add it</button>`;
    ui.msgOk = false; return render(); }
  state.rules.push(rule); save();
  ui.msg = note + (present ? "Rule added." : `Rule added, but no ${SCOPE[scope]} on this list is in ${esc(country)}, so it changes nothing.`); ui.msgOk = true;
  document.getElementById("cty").value = ""; render(); document.getElementById("cty").value = "";
}
render();
</script></body></html>
